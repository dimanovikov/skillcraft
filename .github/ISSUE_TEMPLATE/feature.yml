name: feature request
description: Suggest a new rule, converter, or CLI behavior.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent-config pain does this solve?
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - new lint rule (SCxxx)
        - new format converter
        - CLI behavior
        - sync behavior
        - other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should it do? For a rule, give one example that should pass and one that should fail.
    validations:
      required: true
